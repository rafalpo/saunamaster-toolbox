stages:
  - test
  - build_image
  - deploy

test_fe:
  stage: test
  image: node:20
  before_script:
    - cd frontend
  script:
    - echo "Running frontend tests..."
    - npm install
    - npm run lint

test_be:
  stage: test
  image: maven:3.9.10-eclipse-temurin-21
  before_script:  
    - cd backend
  script:
    - mvn clean test

build_backend:
  stage: build_image
  image: quay.io/buildah/stable:latest
  before_script:
    - cd backend
    - buildah login -u $NEXUS_USER -p $NEXUS_PASS $REGISTRY_URL
    - buildah pull $REGISTRY_URL/saunamaster_toolbox_backend:latest || true
  script:
    - |
      buildah bud \
      -f Dockerfile \
      --cache-from $REGISTRY_URL/saunamaster_toolbox_backend \
      -t $REGISTRY_URL/saunamaster_toolbox_backend:$CI_COMMIT_SHORT_SHA \
      -t $REGISTRY_URL/saunamaster_toolbox_backend:latest \
      .
    - buildah push $REGISTRY_URL/saunamaster_toolbox_backend:latest
    - buildah push $REGISTRY_URL/saunamaster_toolbox_backend:$CI_COMMIT_SHORT_SHA

build_frontend:
  stage: build_image
  image: quay.io/buildah/stable:latest
  before_script:
    - cd frontend
    - buildah login -u $NEXUS_USER -p $NEXUS_PASS $REGISTRY_URL
    - buildah pull $REGISTRY_URL/saunamaster_toolbox_frontend:latest || true
  script:
    - |
      buildah bud \
      -f Dockerfile \
      --cache-from $REGISTRY_URL/saunamaster_toolbox_frontend \
      -t $REGISTRY_URL/saunamaster_toolbox_frontend:$CI_COMMIT_SHORT_SHA \
      -t $REGISTRY_URL/saunamaster_toolbox_frontend:latest \
      .
    - buildah push $REGISTRY_URL/saunamaster_toolbox_frontend:latest
    - buildah push $REGISTRY_URL/saunamaster_toolbox_frontend:$CI_COMMIT_SHORT_SHA
  
deploy:
  stage: deploy
  image: $REGISTRY_URL/tools/ubuntu-git:latest
  before_script:
    - ssh-keyscan github.com >> ~/.ssh/known_hosts
    - mkdir -p /workdir/
    - echo "$GITHUB_PRIVATE_KEY" > ~/.ssh/id_rsa
    - echo "$GITHUB_PUBLIC_KEY" > ~/.ssh/id_rsa.pub
    - chmod 600 ~/.ssh/id_rsa
    - chmod 644 ~/.ssh/id_rsa.pub
    - git clone git@github.com:rafalpo/homelab.git /workdir/
    - cd /workdir/saunamaster-toolbox-prod-1/
  script:
    - 'sed -i "s|image:.*$|image: $REGISTRY_URL/saunamaster_toolbox_backend:$CI_COMMIT_SHORT_SHA|g" Deployment-backend.yaml'
    - 'sed -i "s|image:.*$|image: $REGISTRY_URL/saunamaster_toolbox_frontend:$CI_COMMIT_SHORT_SHA|g" Deployment-frontend.yaml'
    - git add Deployment-backend.yaml Deployment-frontend.yaml
    - 'git commit -m "Saunamaster Toolbox actualization for version: $CI_COMMIT_SHORT_SHA"'
    - git push origin master
