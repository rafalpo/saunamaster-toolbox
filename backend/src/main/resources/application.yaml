spring:
  application:
    name: saunamaster-toolbox
  datasource:
    driver-class-name:  org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
management:
  endpoints:
    web:
      exposure:
        include: "info,health"
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true
